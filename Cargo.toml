[package]
name = "io-jmap"
description = "JMAP client library for Rust"
version = "0.10.1"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["api-bindings", "email", "no-std"]
keywords = ["io-free", "no-std", "coroutine", "jmap", "email"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/io-jmap/latest/io_jmap"
repository = "https://github.com/pimalaya/io-jmap"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["client", "rustls-ring"]
client = ["dep:io-http", "io-http/client", "dep:log", "dep:secrecy"]
std = ["client"]
rustls-ring = ["std", "pimalaya-stream/rustls-ring", "dep:anyhow", "dep:pimalaya-stream"]
rustls-aws = ["std", "pimalaya-stream/rustls-aws", "dep:anyhow", "dep:pimalaya-stream"]
native-tls = ["std", "pimalaya-stream/native-tls", "dep:anyhow", "dep:pimalaya-stream"]
schemars = ["dep:schemars"]
ical = ["dep:ical-rs"]
vcard = ["dep:vcard-rs"]
vendored = ["pimalaya-stream?/vendored"]

[[example]]
name = "session"
path = "examples/session.rs"
required-features = ["rustls-ring"]

[[example]]
name = "push_subscription"
path = "examples/push_subscription.rs"
required-features = ["rustls-ring"]

[dev-dependencies]
env_logger = "0.11"
ical-rs = { version = "0.7", default-features = false, features = ["jscalendar", "parser"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
secrecy = { version = "0.10", default-features = false }
serde_json = "1"
url = { version = "2.5", default-features = false }

[dependencies]
anyhow = { version = "1", optional = true }
ical-rs = { version = "0.7", default-features = false, features = ["jscalendar", "parser"], optional = true }
io-http = { version = "0.9", default-features = false, optional = true }
log = { version = "0.4", default-features = false, optional = true }
pimalaya-stream = { version = "0.4", default-features = false, optional = true }
schemars = { version = "1", optional = true, default-features = false, features = ["derive"] }
secrecy = { version = "0.10", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"] }
thiserror = { version = "2", default-features = false }
url = { version = "2.5", default-features = false, features = ["serde"] }
vcard-rs = { version = "0.6", default-features = false, features = ["jscontact", "parser"], optional = true }
